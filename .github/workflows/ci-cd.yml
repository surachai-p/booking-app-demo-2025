name: CI/CD Pipeline - Booking App

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '20'

jobs:
  backend-test:
    name: Backend Tests (Newman API)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: booking_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booking_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate --schema=prisma/schema.prisma
      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booking_test
        run: npx prisma migrate deploy --schema=prisma/schema.prisma
      - name: Seed test data
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booking_test
          JWT_SECRET: ci-test-secret-key
          NODE_ENV: test
        run: |
          node -e "
            const { PrismaClient } = require('@prisma/client');
            const bcrypt = require('bcryptjs');
            const prisma = new PrismaClient();
            async function seed() {
              const hash = await bcrypt.hash('admin123', 10);
              await prisma.user.upsert({
                where: { username: 'admin' },
                update: { password: hash, role: 'admin' },
                create: { username: 'admin', password: hash, role: 'admin' }
              });
              await prisma.room.upsert({
                where: { roomType: 'Standard' },
                update: {},
                create: {
                  name: 'Test Room 101',
                  roomType: 'Standard',
                  description: 'Room for CI testing',
                  capacity: 2,
                  price: 1000
                }
              });
              console.log('Seed completed');
            }
            seed().catch((error) => {
              console.error(error);
              process.exitCode = 1;
            }).finally(() => prisma.\$disconnect());
          "
      - name: Start backend server
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booking_test
          JWT_SECRET: ci-test-secret-key
          PORT: '3001'
          NODE_ENV: test
        run: |
          npm start &
          for i in {1..30}; do
            if curl -fsS http://localhost:3001/api/rooms > /dev/null; then
              echo 'Backend ready'
              exit 0
            fi
            sleep 2
          done
          echo 'Backend failed to start'
          exit 1
      - name: Install Newman
        run: npm install -g newman
      - name: Run Newman API tests
        run: |
          newman run tests/booking-api.postman_collection.json \
            --env-var "baseUrl=http://localhost:3001" \
            --reporters cli,junit \
            --reporter-junit-export newman-results.xml
      - name: Upload Newman test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-test-results
          path: newman-results.xml
          if-no-files-found: warn

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:3001
        run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/

  security-scan:
    name: Security Scan (npm audit)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Audit Backend dependencies
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Audit Frontend dependencies
        if: always()
        working-directory: frontend
        run: npm audit --audit-level=high

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ENABLE_DEPLOY == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Deploy to Vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo 'Missing VERCEL_TOKEN'; exit 1; }
          vercel --prod --token "$VERCEL_TOKEN" --yes

  deploy-backend-render:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ENABLE_DEPLOY == 'true'
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL" || { echo 'Missing RENDER_DEPLOY_HOOK_URL'; exit 1; }
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
      - name: Wait for Render deployment and health check
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          test -n "$RENDER_BACKEND_URL" || { echo 'Missing RENDER_BACKEND_URL'; exit 1; }
          for i in {1..30}; do
            if curl -fsS --connect-timeout 5 --max-time 10 "${RENDER_BACKEND_URL%/}/api/rooms" > /dev/null; then
              echo 'Render backend is healthy'
              exit 0
            fi
            sleep 10
          done
          echo 'Render health check failed'
          exit 1
